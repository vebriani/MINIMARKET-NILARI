
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minimarket Nilari</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>
            <marquee>SELAMAT DATANG DI MINIMARKET NILARI</marquee>
        </h1>

        <div id="product-list">
            <center><h2>DAFTAR PRODUK</h2></center>

            <!-- Tempat produk ditampilkan oleh JavaScript -->
            <div id="products" class="product-container"></div>
        </div>

        <div id="cart">
            <h2>Keranjang Belanja</h2>

            <ul id="cartItems"></ul>

            <p>Total: <span id="total-price">Rp 0</span></p>

            <button id="checkout-btn">Checkout</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
